# Validate typescript files, links and markdown
#
# Configuration files:
# - typescript: tsconfig.json
# - links: scripts/linkValidator.js
# - markdown: .markdownlint.jsonc
name: Lint
permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-lint
  cancel-in-progress: true

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  code:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'capoworks'

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run lint:code

  links:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'capoworks'

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run lint:links

  markdown:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'capoworks'

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run lint:md
