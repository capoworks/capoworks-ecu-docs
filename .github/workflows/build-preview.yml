# Validate pull requests and manually selected revisions without deploying.
name: Build preview

permissions:
  contents: read

concurrency:
  group: build-preview-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: Exact 40-character commit SHA to build
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Validate manual ref
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ inputs.ref }}
        run: |
          if [[ ! "$REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::workflow_dispatch ref must be a full 40-character commit SHA"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Node.js dependencies
        run: npm ci

      - name: Lint code, links, and Markdown
        run: npm run lint

      - name: Run all stdlib documentation tests
        run: >-
          python3 -m unittest discover
          --start-directory scripts
          --pattern 'test_ai_docs*.py'
          --verbose

      - name: Build
        run: npm run build
