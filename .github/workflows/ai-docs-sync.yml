name: AI firmware docs sync

on:
  push:
    branches: [master]
    paths:
      - .ai-docs/state.json
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [firmware-updated]

permissions:
  contents: read

concurrency:
  group: ai-docs-sync
  cancel-in-progress: false

jobs:
  unit-tests:
    name: Sync unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'capoworks/capoworks-ecu-docs'
    permissions:
      contents: read
    steps:
      - name: Check out documentation repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run stdlib unit tests
        run: >-
          python3 -m unittest discover
          --start-directory scripts
          --pattern 'test_ai_docs*.py'
          --verbose

  sync:
    name: Prepare, generate, select, and validate publication
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.repository == 'capoworks/capoworks-ecu-docs'
    outputs:
      publish: ${{ steps.select.outputs.publish }}
      pr_number: ${{ steps.select.outputs.pr_number }}
      base_sha: ${{ steps.select.outputs.base_sha }}
      head_sha: ${{ steps.select.outputs.head_sha }}
      merge_sha: ${{ steps.select.outputs.merge_sha }}
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Check out documentation master without persisted credentials
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Recover a missed deploy without remerging
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -u scripts/ai-docs-publish.py recover

      - name: Prepare source range and audit context
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_DOCS_MAX_CURRENT_FILES: ${{ vars.AI_DOCS_MAX_CURRENT_FILES }}
          AI_DOCS_MAX_WIKI_DOCS: ${{ vars.AI_DOCS_MAX_WIKI_DOCS }}
          AI_DOCS_MAX_OUTPUT_FILES: ${{ vars.AI_DOCS_MAX_OUTPUT_FILES }}
          AI_DOCS_WORK_DIR: ${{ runner.temp }}/ai-docs-sync
        run: python3 -u scripts/ai-docs-sync.py prepare

      # This is the only step that receives the model credential. It does not
      # receive a GitHub token and does not execute source files or generated MDX.
      - name: Generate and validate structured documentation
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AI_DOCS_MODEL: ${{ vars.AI_DOCS_MODEL || 'deepseek-flash' }}
          AI_DOCS_MAX_TOKENS: ${{ vars.AI_DOCS_MAX_TOKENS }}
          AI_DOCS_TIMEOUT_SECONDS: ${{ vars.AI_DOCS_TIMEOUT_SECONDS }}
          AI_DOCS_RETRIES: ${{ vars.AI_DOCS_RETRIES }}
          AI_DOCS_MAX_CURRENT_FILES: ${{ vars.AI_DOCS_MAX_CURRENT_FILES }}
          AI_DOCS_MAX_WIKI_DOCS: ${{ vars.AI_DOCS_MAX_WIKI_DOCS }}
          AI_DOCS_MAX_OUTPUT_FILES: ${{ vars.AI_DOCS_MAX_OUTPUT_FILES }}
          AI_DOCS_WORK_DIR: ${{ runner.temp }}/ai-docs-sync
        run: python3 -u scripts/ai-docs-sync.py generate

      # This step never receives DEEPSEEK_API_KEY. It revalidates everything,
      # writes atomically, pushes with a lease, opens a PR, and dispatches CI.
      - name: Validate, commit, push, and open pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_DOCS_WORK_DIR: ${{ runner.temp }}/ai-docs-sync
        run: python3 -u scripts/ai-docs-sync.py finalize

      # Select is read-only even though this job can push. It accepts only the
      # fixed bot branch and validates the exact GitHub merge-preview tree.
      - name: Select and validate the pending publication
        id: select
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_DOCS_WORK_DIR: ${{ runner.temp }}/ai-docs-sync
        run: python3 -u scripts/ai-docs-publish.py select

  validate-publication:
    name: Validate exact merge preview
    needs: sync
    if: needs.sync.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out the exact merge preview without credentials
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync.outputs.merge_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install Node.js dependencies
        run: npm ci

      - name: Lint code, links, and Markdown
        run: npm run lint

      - name: Run all stdlib documentation tests
        run: >-
          python3 -m unittest discover
          --start-directory scripts
          --pattern 'test_ai_docs*.py'
          --verbose

      - name: Build the documentation site
        run: npm run build

  mark-publication-failed:
    name: Record failed publication candidate
    needs: [sync, validate-publication]
    if: >-
      always() &&
      needs.sync.outputs.publish == 'true' &&
      needs.validate-publication.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the selected trusted base without credentials
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync.outputs.base_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Record the exact failed candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.sync.outputs.pr_number }}
          BASE_SHA: ${{ needs.sync.outputs.base_sha }}
          HEAD_SHA: ${{ needs.sync.outputs.head_sha }}
          RUN_ID: ${{ github.run_id }}
        run: >-
          python3 -u scripts/ai-docs-publish.py mark-failed
          --pr-number "$PR_NUMBER"
          --base-sha "$BASE_SHA"
          --head-sha "$HEAD_SHA"
          --run-id "$RUN_ID"

  merge-publication:
    name: Merge validated publication and dispatch follow-ups
    needs: [sync, validate-publication]
    if: >-
      needs.sync.outputs.publish == 'true' &&
      needs.validate-publication.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Check out the selected trusted base without persisted credentials
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # REST merge pins the PR head but cannot atomically pin its base.
      # Post-merge tree check rejects unexpected results; Pages fully validates actual master before public deploy.
      # GitHub enforces any configured protection.
      - name: Revalidate, merge, and dispatch deploy and sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.sync.outputs.pr_number }}
          BASE_SHA: ${{ needs.sync.outputs.base_sha }}
          HEAD_SHA: ${{ needs.sync.outputs.head_sha }}
          MERGE_SHA: ${{ needs.sync.outputs.merge_sha }}
        run: >-
          python3 -u scripts/ai-docs-publish.py merge
          --pr-number "$PR_NUMBER"
          --base-sha "$BASE_SHA"
          --head-sha "$HEAD_SHA"
          --merge-sha "$MERGE_SHA"
